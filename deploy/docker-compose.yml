# Lives on the VPS at /opt/travelar/docker-compose.yml (bootstrap.sh copies it).
#
# The Travelar stack on srv1881651, beside furnify and softech.agency.
#
# - Images come from GHCR, published by each repo's Deploy workflow once its
#   quality gate is green. Nothing is built on the server.
# - No `ports:` anywhere. The nginx container that already owns :80/:443
#   (hatim_backend-nginx-1) reaches travelar-web and travelar-api by container
#   name over hatim_backend_default, so nothing here is reachable from the
#   internet directly or can collide with a port another site uses.
# - Every service and container is named travelar-*. The proxy network is
#   shared with other projects, and Docker registers each service name as a DNS
#   alias on every network the service joins, so a service called `web` or
#   `api` could answer lookups meant for a neighbour's. Postgres is not on that
#   network at all.
# - Memory limits are ceilings, so this stack can never be the reason the box
#   OOMs. furnify reserves 4.75 GB and softech 768 MB of the 8 GB.
#
# Every ${VAR} comes from /opt/travelar/.env — see travelar.env.example.

name: travelar

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-env
  NODE_ENV: production
  PORT: "5050"
  DATABASE_URL: postgresql://travelar:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@travelar-db:5432/travelar
  REDIS_URL: ""
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  # The API's public address. SSLCommerz posts payment results to
  # https://DOMAIN/api/v1/billing/sslcommerz/*, which nginx routes to the API.
  BETTER_AUTH_URL: https://${DOMAIN:?set DOMAIN}
  ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET}
  REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET}
  ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-1d}
  REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
  FRONTEND_URL: https://${DOMAIN}
  TRIAL_DAYS: ${TRIAL_DAYS:-7}
  EMAIL_SENDER_SMTP_HOST: ${EMAIL_SENDER_SMTP_HOST:-}
  EMAIL_SENDER_SMTP_PORT: ${EMAIL_SENDER_SMTP_PORT:-465}
  EMAIL_SENDER_SMTP_USER: ${EMAIL_SENDER_SMTP_USER:-}
  EMAIL_SENDER_SMTP_PASS: ${EMAIL_SENDER_SMTP_PASS:-}
  EMAIL_SENDER_SMTP_FROM: ${EMAIL_SENDER_SMTP_FROM:-}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
  SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
  SSLCOMMERZ_IS_LIVE: ${SSLCOMMERZ_IS_LIVE:-false}
  SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?set SUPER_ADMIN_EMAIL}
  SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?set SUPER_ADMIN_PASSWORD}
  SENTRY_DSN: ${SENTRY_DSN:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # One API instance, so the hourly jobs run in-process.
  JOBS_ENABLED: "true"
  CRON_SECRET: ${CRON_SECRET:-}

services:
  travelar-db:
    image: postgres:16-alpine
    container_name: travelar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: travelar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: travelar
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelar -d travelar"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }
    logging: *logging

  # pg_dump at start and nightly into /opt/travelar/backups, 14 days kept.
  # Copy that folder off the machine; restore steps: ops/backup/README.md.
  travelar-backup:
    image: postgres:16-alpine
    container_name: travelar-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/ops/entrypoint.sh"]
    environment:
      PGHOST: travelar-db
      PGUSER: travelar
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: travelar
      BACKUP_DIR: /backups
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 21 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./ops/backup:/ops:ro
      - ./backups:/backups
    networks: [internal]
    depends_on:
      travelar-db:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.5" }
    logging: *logging

  # Runs to completion on every `up` whose API image changed, and the API waits
  # for it, so a release never starts against an old schema.
  travelar-migrate:
    image: ${API_IMAGE:?set API_IMAGE}
    container_name: travelar-migrate
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: *api-env
    networks: [internal]
    depends_on:
      travelar-db:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits: { memory: 384M, cpus: "1.0" }
    logging: *logging

  travelar-api:
    image: ${API_IMAGE:?set API_IMAGE}
    container_name: travelar-api
    restart: unless-stopped
    environment:
      <<: *api-env
      # Node sizes its heap from the host's memory, not from the limit below,
      # so without this it grows happily past what the container is allowed
      # and the kernel kills it. An agency importing its old spreadsheet is
      # what finds this: reading the workbook is the one thing here that
      # allocates hundreds of megabytes at once. Kept under the limit so V8
      # collects hard first — being slow beats being killed mid-import.
      NODE_OPTIONS: "--max-old-space-size=1024"
    expose:
      - "5050"
    # internal for Postgres; proxy only so nginx can hand it the payment
    # gateway's callbacks. The web app talks to it over internal.
    networks: [internal, proxy]
    depends_on:
      travelar-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        # Reading an agency's whole workbook is held in memory while it is
        # parsed. 512M was not enough for a real one and the import was
        # killed a step in; this is a ceiling, not a reservation, so nothing
        # is taken from the other sites on this host until it is needed.
        limits: { memory: 1536M, cpus: "1.0" }
    logging: *logging

  travelar-web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    container_name: travelar-web
    restart: unless-stopped
    environment:
      # Server-to-server over the internal network; never leaves the host.
      API_BASE_URL: http://travelar-api:5050/api/v1
      # Wired from the API's own secret so the two can never drift apart — a
      # mismatch silently bounces every protected page to /login.
      JWT_ACCESS_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET}
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN:?set DOMAIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"
    networks: [internal, proxy]
    depends_on:
      travelar-api:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.0" }
    logging: *logging

volumes:
  db-data:

networks:
  internal: {}
  proxy:
    # Created by the hatim stack; joined, never managed, from here.
    name: hatim_backend_default
    external: true
